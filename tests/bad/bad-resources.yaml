apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-test-resources
  namespace: securesupply
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyverno-test-resources
  template:
    metadata:
      labels:
        app: kyverno-test-resources
    spec:
      containers:
      - name: app
        image: nginx:1.27
