apiVersion: v1
kind: Pod
metadata:
  name: secure-good
  namespace: securesupply
  labels:
    app.kubernetes.io/name: securesupply
    app.kubernetes.io/part-of: securesupply
    security.networkpolicy/enforced: "true"
spec:
  serviceAccountName: securesupply
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ECR_REGISTRY_PLACEHOLDER/securesupply@sha256:CHANGE_ME
      ports:
        - containerPort: 8080
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}
      readinessProbe:
        httpGet: {path: /health, port: 8080}
      livenessProbe:
        httpGet: {path: /health, port: 8080}
