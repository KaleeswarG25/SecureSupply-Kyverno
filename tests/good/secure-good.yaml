apiVersion: v1
kind: Pod
metadata:
  name: secure-good
  namespace: securesupply
  labels:
    app.kubernetes.io/name: securesupply
    app.kubernetes.io/part-of: securesupply
    security.networkpolicy/enforced: "true"
spec:
  serviceAccountName: securesupply
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: 124502390077.dkr.ecr.us-east-1.amazonaws.com/securesupply@sha256:3af5e519eeeca898e237ffd01872b5def89dccf870a32aa9cd9f81ec9c969f6a
      ports:
        - containerPort: 8080
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
