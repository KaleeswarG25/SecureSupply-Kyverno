apiVersion: apps/v1
kind: Deployment
metadata:
  name: securesupply
  namespace: securesupply
  labels:
    app.kubernetes.io/name: securesupply
    app.kubernetes.io/component: application
    environment: production
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: securesupply

  template:
    metadata:
      labels:
        app.kubernetes.io/name: securesupply
        app.kubernetes.io/component: application
        environment: production

    spec:
      serviceAccountName: securesupply
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: securesupply
          image: REPLACE_WITH_ECR_IMAGE

          ports:
            - containerPort: 8080

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
