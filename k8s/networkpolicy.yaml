apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securesupply
  namespace: securesupply
  labels:
    security.networkpolicy/enforced: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securesupply
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
