apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securesupply
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KaleeswarG25/SecureSupply-Kyverno.git
    targetRevision: main
    path: generated
  destination:
    server: https://kubernetes.default.svc
    namespace: securesupply
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
