name: Secure Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

env:
  IMAGE_NAME: securesupply
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:

  # ============================================================
  # 1. STATIC SECURITY / BASIC VALIDATION
  # ============================================================
  static-security:
    name: Secrets, tests and IaC checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Secret detection
      # ----------------------------------------------------------
      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2

      # ----------------------------------------------------------
      # Python syntax
      # ----------------------------------------------------------
      - name: Python syntax
        run: |
          python -m py_compile app/app.py

      # ----------------------------------------------------------
      # Discover Kubernetes YAML files
      # ----------------------------------------------------------
      - name: Discover Kubernetes YAML files
        shell: bash
        run: |
          set -e

          echo "Kubernetes files:"
          find k8s -type f \( -name "*.yaml" -o -name "*.yml" \) -print

          if ! find k8s -type f \( -name "*.yaml" -o -name "*.yml" \) | grep -q .; then
            echo "ERROR: No Kubernetes YAML files found under k8s/"
            exit 1
          fi

      # ----------------------------------------------------------
      # YAML syntax validation
      # ----------------------------------------------------------
      - name: YAML parse
        shell: bash
        run: |
          set -e

          files=$(find k8s -type f \( -name "*.yaml" -o -name "*.yml" \))

          for file in $files; do
            echo "Validating YAML: $file"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              mikefarah/yq:4 \
              eval '.' "$file" > /dev/null
          done

          echo "All Kubernetes YAML files parsed successfully."


  # ============================================================
  # 2. BUILD + TRIVY + SBOM
  # ============================================================
  build-scan-sbom:
    name: Build, Trivy and SBOM
    runs-on: ubuntu-latest
    needs: static-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build image
        run: |
          docker build \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            ./app

      # ----------------------------------------------------------
      # Trivy vulnerability scan
      # ----------------------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # ----------------------------------------------------------
      # Generate SBOM
      # ----------------------------------------------------------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # ----------------------------------------------------------
      # Upload SBOM
      # ----------------------------------------------------------
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json


  # ============================================================
  # 3. SUPPLY CHAIN
  # ============================================================
  supply-chain:
    name: ECR push, Cosign signature, SBOM and provenance

    # Don't push/sign images from pull requests.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    needs: build-scan-sbom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: DEBUG GitHub OIDC context
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
      # ----------------------------------------------------------
      # AWS OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::124502390077:role/SecureSupply-GitHubActions
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # ----------------------------------------------------------
      # Verify AWS OIDC authentication
      # ----------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # ECR login
      # ----------------------------------------------------------
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Build + push immutable SHA image
      # ----------------------------------------------------------
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ env.ECR_REGISTRY }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}

        shell: bash
        run: |
          set -e

          IMAGE="$REGISTRY/$REPOSITORY:${GITHUB_SHA}"

          echo "Building: $IMAGE"

          docker build \
            -t "$IMAGE" \
            ./app

          echo "Pushing: $IMAGE"

          docker push "$IMAGE"

          echo "Getting image digest..."

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE" | cut -d'@' -f2)

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Could not determine image digest."
            exit 1
          fi

          IMAGE_REF="$REGISTRY/$REPOSITORY@$DIGEST"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

          echo "Immutable image:"
          echo "$IMAGE_REF"

      # ----------------------------------------------------------
      # Cosign installation
      # ----------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      # ----------------------------------------------------------
      # Keyless image signing
      # ----------------------------------------------------------
      - name: Sign image keylessly
        env:
          COSIGN_YES: "true"

        run: |
          cosign sign "$IMAGE_REF"

      # ----------------------------------------------------------
      # Generate SBOM for exact ECR image
      # ----------------------------------------------------------
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # ----------------------------------------------------------
      # Attach SBOM attestation to image
      # ----------------------------------------------------------
      - name: Attest SBOM with Cosign
        env:
          COSIGN_YES: "true"

        run: |
          cosign attest \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "$IMAGE_REF"

      # ----------------------------------------------------------
      # SLSA build provenance
      # ----------------------------------------------------------
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
