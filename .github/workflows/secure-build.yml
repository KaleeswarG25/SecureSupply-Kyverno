name: Secure Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: securesupply
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:

  # ============================================================
  # 1. STATIC SECURITY / BASIC VALIDATION
  # ============================================================
  static-security:
    name: Secrets, tests and IaC checks
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout full Git history
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Secret detection
      # ----------------------------------------------------------
      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Python syntax validation
      # ----------------------------------------------------------
      - name: Python syntax
        run: |
          set -e

          echo "Checking Python syntax..."

          python -m py_compile app/app.py

          echo "Python syntax check passed."

      # ----------------------------------------------------------
      # Discover Kubernetes YAML files
      # ----------------------------------------------------------
      - name: Discover Kubernetes YAML files
        shell: bash
        run: |
          set -e

          echo "Kubernetes files:"

          find k8s -type f \( -name "*.yaml" -o -name "*.yml" \) -print

          if ! find k8s -type f \( -name "*.yaml" -o -name "*.yml" \) | grep -q .; then
            echo "ERROR: No Kubernetes YAML files found under k8s/"
            exit 1
          fi

      # ----------------------------------------------------------
      # YAML syntax validation
      # ----------------------------------------------------------
      - name: YAML parse
        shell: bash
        run: |
          set -e

          files=$(find k8s -type f \( -name "*.yaml" -o -name "*.yml" \))

          for file in $files; do
            echo "Validating YAML: $file"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              mikefarah/yq:4 \
              eval '.' "$file" > /dev/null
          done

          echo "All Kubernetes YAML files parsed successfully."


  # ============================================================
  # 2. BUILD + TRIVY + SBOM
  # ============================================================
  build-scan-sbom:
    name: Build, Trivy and SBOM
    runs-on: ubuntu-latest
    needs: static-security

    steps:

      # ----------------------------------------------------------
      # Checkout full Git history
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build image
        shell: bash
        run: |
          set -e

          echo "Building application image..."

          docker build \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            ./app

          echo "Docker build completed."

      # ----------------------------------------------------------
      # Trivy vulnerability scan
      # ----------------------------------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # ----------------------------------------------------------
      # Generate CycloneDX SBOM
      # ----------------------------------------------------------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # ----------------------------------------------------------
      # Upload SBOM artifact
      # ----------------------------------------------------------
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json


  # ============================================================
  # 3. SUPPLY CHAIN
  # ============================================================
  supply-chain:
    name: ECR push, Cosign signature, SBOM and provenance

    # Never push/sign images from pull requests.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    needs: build-scan-sbom

    steps:

      # ----------------------------------------------------------
      # Checkout full Git history
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # GitHub context
      # ----------------------------------------------------------
      - name: DEBUG GitHub context
        shell: bash
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_SHA=$GITHUB_SHA"

      # ----------------------------------------------------------
      # AWS access key authentication
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Verify AWS authentication
      # ----------------------------------------------------------
      - name: Verify AWS identity
        shell: bash
        run: |
          set -e

          echo "AWS identity:"

          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------------------------
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Build and push immutable SHA image
      # ----------------------------------------------------------
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ env.ECR_REGISTRY }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}

        shell: bash
        run: |
          set -e

          IMAGE="$REGISTRY/$REPOSITORY:${GITHUB_SHA}"

          echo "=========================================="
          echo "Building immutable image"
          echo "=========================================="
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            ./app

          echo "=========================================="
          echo "Pushing image to ECR"
          echo "=========================================="
          echo "$IMAGE"

          docker push "$IMAGE"

          echo "=========================================="
          echo "Getting ECR image digest"
          echo "=========================================="

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE" | cut -d'@' -f2)

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Could not determine image digest."
            exit 1
          fi

          IMAGE_REF="$REGISTRY/$REPOSITORY@$DIGEST"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Immutable image"
          echo "=========================================="
          echo "$IMAGE_REF"

          echo "=========================================="
          echo "Image digest"
          echo "=========================================="
          echo "$DIGEST"

      # ----------------------------------------------------------
      # Install Cosign
      # ----------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      # ----------------------------------------------------------
      # Verify Cosign installation
      # ----------------------------------------------------------
      - name: Verify Cosign installation
        shell: bash
        run: |
          set -e

          cosign version

      # ----------------------------------------------------------
      # Keyless image signing
      # ----------------------------------------------------------
      - name: Sign image keylessly
        env:
          COSIGN_YES: "true"

        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Signing image with Cosign keyless signing"
          echo "=========================================="

          echo "$IMAGE_REF"

          cosign sign "$IMAGE_REF"

          echo "Cosign image signature created."

      # ----------------------------------------------------------
      # Generate CycloneDX SBOM for exact ECR image
      # ----------------------------------------------------------
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # ----------------------------------------------------------
      # Validate SBOM file exists
      # ----------------------------------------------------------
      - name: Validate SBOM
        shell: bash
        run: |
          set -e

          if [ ! -s sbom.cdx.json ]; then
            echo "ERROR: SBOM file was not generated."
            exit 1
          fi

          echo "SBOM generated successfully."

          echo "SBOM size:"
          wc -c sbom.cdx.json

      # ----------------------------------------------------------
      # Attach CycloneDX SBOM using GitHub Attestations
      # ----------------------------------------------------------
      - name: Attest CycloneDX SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # ----------------------------------------------------------
      # SLSA build provenance
      # ----------------------------------------------------------
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      # ----------------------------------------------------------
      # Final supply-chain summary
      # ----------------------------------------------------------
      - name: Supply chain summary
        shell: bash
        run: |
          echo "=========================================="
          echo "SECURE SUPPLY CHAIN COMPLETE"
          echo "=========================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Commit     : $GITHUB_SHA"
          echo "Image      : $IMAGE_REF"
          echo "Digest     : $IMAGE_DIGEST"
          echo "Signature  : Cosign keyless"
          echo "SBOM       : CycloneDX"
          echo "Provenance : SLSA"
          echo "=========================================="
