name: Secure Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: securesupply
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  static-security:
    name: Secrets, tests and IaC checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2

      - name: Python syntax
        run: python -m py_compile app/app.py

      - name: YAML parse
        uses: docker://mikefarah/yq:4
        with:
          args: eval-all '.' k8s/*.yaml

  build-scan-sbom:
    name: Build, Trivy and SBOM
    runs-on: ubuntu-latest
    needs: static-security
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} ./app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Install Syft
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          output-format: cyclonedx-json
          output-file: sbom.cdx.json
          fail-build: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  supply-chain:
    name: ECR push, Cosign signature, SBOM and provenance
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-scan-sbom
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          REGISTRY: ${{ env.ECR_REGISTRY }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:${GITHUB_SHA}" ./app
          docker push "$REGISTRY/$REPOSITORY:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$REPOSITORY:${GITHUB_SHA}" | cut -d'@' -f2)
          echo "IMAGE_REF=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      - name: Sign image keylessly
        env:
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE_REF"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest SBOM with Cosign
        env:
          COSIGN_YES: "true"
        run: cosign attest --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
